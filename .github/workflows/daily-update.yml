name: Daily Economic Brief Auto-Update

on:
  schedule:
    # 매일 한국 시간(KST) 오전 06:00 실행 (UTC 기준 전날 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U google-genai feedparser

      - name: Fetch RSS and update data.json via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: Commit and push updated data.json
        run: |
          if git diff --quiet data.json; then
            echo "변경된 데이터가 없습니다. 커밋을 건너뜁니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            TODAY_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            git add data.json
            git commit -m "chore: auto-update daily brief data.json (${TODAY_KST})"
            git push origin main
          fi
